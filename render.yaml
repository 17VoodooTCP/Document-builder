# Render Blueprint. Dashboard -> New -> Blueprint -> connect this repository.
services:
  - type: web
    name: document-builder-api
    runtime: node
    rootDir: backend
    plan: free            # spins down after ~15 min idle; first request cold-starts
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # `npm install` runs `prisma generate`, which builds the CLIENT.
      # It does NOT create the database. Run `npm run db:push` once after the
      # first deploy and after every schema change — otherwise every query
      # fails while /health stays green and the service looks healthy.
      #
      # DATABASE_URL must include a database name before the "?":
      #   ...mongodb.net/docbuilder?retryWrites=true
      # Atlas's copy button omits it and the connection dies with
      # "empty database name not allowed".
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Comma-separated origins allowed to call this API. No trailing slashes.
      - key: FRONTEND_URL
        sync: false
      # Where QR codes point — the frontend's public origin.
      - key: PUBLIC_URL
        sync: false

      # Paid access. Funds go straight to these wallets; the API only watches
      # public explorers for incoming transfers and never holds a key.
      #
      # USDT_TRON_ADDRESS must be a Tron (TRC-20) address. The watcher filters
      # on the TRC-20 USDT contract, so an address for any other chain will
      # never match and every payment to it is lost to the payer.
      - key: UNLOCK_PRICE_USD
        value: "49"
      - key: BTC_ADDRESS
        sync: false
      - key: USDT_TRON_ADDRESS
        sync: false
      # Optional — raises the TronGrid rate limit.
      - key: TRONGRID_API_KEY
        sync: false

      # Comma-separated addresses that get the platform operator flag. Set at
      # least one before this deploys, or the paywall locks everybody out —
      # including you — with no way in. Operators bypass it and configure the
      # wallets at /admin.
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
